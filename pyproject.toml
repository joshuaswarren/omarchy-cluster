[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-cluster"
version = "0.1.0"
description = "Split one local MLX model across Apple Silicon Macs (macOS) and Omarchy Linux machines over LAN; OpenAI-compatible gateway."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Joshua Warren" }]

[project.scripts]
omarchy-cluster = "omarchy_cluster.cli:main"

[tool.setuptools]
packages = ["omarchy_cluster"]
