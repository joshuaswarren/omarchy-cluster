# Fallback boot entry using the previous kernel's initramfs fallback image.
title   Omarchy (DGX Spark, GB10, fallback initramfs)
linux   /vmlinuz-linux-dgx-spark
initrd  /initramfs-linux-dgx-spark-fallback.img
options root=UUID=<ROOT_UUID> rootflags=subvol=@ rw \
        nvidia-drm.modeset=1 \
        loglevel=7
