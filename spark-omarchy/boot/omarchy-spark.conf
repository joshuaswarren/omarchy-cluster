# systemd-boot entry for Omarchy on the DGX Spark.
# Install to /boot/loader/entries/omarchy-spark.conf after replacing <ROOT_UUID>
# with the btrfs root partition UUID (blkid -s UUID -o value /dev/<root-part>).
title   Omarchy (DGX Spark, GB10)
linux   /vmlinuz-linux-dgx-spark
initrd  /initramfs-linux-dgx-spark.img
options root=UUID=<ROOT_UUID> rootflags=subvol=@ rw \
        nvidia-drm.modeset=1 \
        loglevel=4 quiet
